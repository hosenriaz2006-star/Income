<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taka Income BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #ffffff; }
        .card-bg { background-color: #1e1e1e; border: 1px solid rgba(255,255,255,0.05); }
        .text-accent { color: #10b981; }
        .btn-accent { background-color: #10b981; color: #121212; font-weight: bold; }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="max-w-md mx-auto">

    <div id="loader" class="fixed inset-0 bg-[#121212] flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-accent mb-4"></div>
        <p class="text-accent">বটে কানেক্ট হচ্ছে...</p>
    </div>

    <div id="app-container" class="min-h-screen flex flex-col opacity-0 transition-opacity duration-500">
        <header class="p-4 flex justify-between items-center sticky top-0 bg-[#121212]/80 backdrop-blur-md z-10">
            <h1 class="text-xl font-bold text-accent">Taka Income BD</h1>
            <i data-lucide="user" onclick="navigateTo('profile-page')" class="cursor-pointer"></i>
        </header>

        <main class="flex-grow p-4 pb-24">
            <div id="home-page" class="sub-page active space-y-6">
                <div class="card-bg p-6 rounded-2xl flex justify-between items-center">
                    <div>
                        <p class="text-xs text-gray-400 uppercase">ব্যালেন্স</p>
                        <p class="text-3xl font-black text-accent">৳ <span id="tk-balance">0.00</span></p>
                    </div>
                    <button onclick="navigateTo('wallet-page')" class="bg-white text-black px-4 py-2 rounded-xl font-bold text-sm">উইথড্র</button>
                </div>

                <div class="space-y-4">
                    <h2 class="font-bold flex items-center gap-2"><i data-lucide="zap" class="text-yellow-400 w-5"></i> ডেইলি টাস্ক (৳ ৫০)</h2>
                    <div id="task-list" class="space-y-3"></div>
                </div>
            </div>

            <div id="profile-page" class="sub-page space-y-6">
                <div class="text-center py-4">
                    <div class="w-20 h-20 bg-accent rounded-full mx-auto flex items-center justify-center text-black text-3xl font-bold mb-2" id="prof-initial">U</div>
                    <h2 id="prof-name" class="text-xl font-bold">---</h2>
                    <p id="prof-id" class="text-gray-500 text-xs mt-1">ID: ---</p>
                </div>
                <div class="space-y-3">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">সোশ্যাল টাস্ক (৳ ৫০ একবার)</h3>
                    <div id="social-list" class="space-y-3"></div>
                </div>
                <div class="card-bg p-4 rounded-xl flex justify-between text-sm">
                    <span>মোট রেফার:</span><span id="total-ref" class="text-accent font-bold">0</span>
                </div>
            </div>

            <div id="wallet-page" class="sub-page space-y-4">
                <h2 class="text-xl font-bold text-center">টাকা তুলুন</h2>
                <div class="card-bg p-5 rounded-2xl space-y-4">
                    <p class="text-[11px] text-red-400 text-center font-bold">শর্ত: কমপক্ষে ৫টি রেফার এবং ৫০০ টাকা প্রয়োজন।</p>
                    <input id="withdraw-amount" type="number" placeholder="টাকার পরিমাণ (৫০০+)" class="w-full p-3 rounded-xl bg-black/40 border border-gray-700 outline-none">
                    <select id="withdraw-method" class="w-full p-3 rounded-xl bg-black/40 border border-gray-700 outline-none">
                        <option value="Bkash">বিকাশ</option>
                        <option value="Nagad">নগদ</option>
                    </select>
                    <input id="payment-number" type="number" placeholder="আপনার নম্বর" class="w-full p-3 rounded-xl bg-black/40 border border-gray-700 outline-none">
                    <button id="withdraw-btn" class="w-full p-3 rounded-xl btn-accent">উইথড্র রিকোয়েস্ট পাঠান</button>
                </div>
            </div>

            <div id="refer-page" class="sub-page text-center space-y-6">
                <div class="card-bg p-8 rounded-[2rem]">
                    <p class="text-gray-400 text-sm">প্রতি রেফারে বোনাস</p>
                    <h2 class="text-4xl font-black text-accent mt-2">৳ ১০০.০০</h2>
                    <p class="text-xs text-gray-500 mt-4">লিঙ্ক শেয়ার করুন এবং টাকা ইনকাম করুন।</p>
                    <button id="share-btn" class="w-full btn-accent py-4 rounded-2xl mt-8 flex items-center justify-center gap-2">
                        <i data-lucide="copy"></i> রেফারেল লিঙ্ক কপি করুন
                    </button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 grid grid-cols-4 py-3 bg-[#121212] border-t border-white/5 z-20">
            <button onclick="navigateTo('home-page')" class="nav-btn"><i data-lucide="home" class="mx-auto w-6 h-6"></i></button>
            <button onclick="navigateTo('wallet-page')" class="nav-btn"><i data-lucide="wallet" class="mx-auto w-6 h-6"></i></button>
            <button onclick="navigateTo('refer-page')" class="nav-btn"><i data-lucide="users" class="mx-auto w-6 h-6"></i></button>
            <button onclick="navigateTo('profile-page')" class="nav-btn"><i data-lucide="user" class="mx-auto w-6 h-6"></i></button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpH_zn1KQPcIsPojC02UzXLdc017e-Unw",
            authDomain: "bdincomezone-767b4.firebaseapp.com",
            projectId: "bdincomezone-767b4",
            storageBucket: "bdincomezone-767b4.firebasestorage.app",
            messagingSenderId: "1026541741286",
            appId: "1:1026541741286:web:735f4f134ab159b5d28727"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        let userData = null;
        let config = {};

        async function init() {
            tg.expand();
            const user = tg.initDataUnsafe?.user;
            if(!user) return;

            // Load Global Config
            const confSnap = await getDoc(doc(db, "config", "main"));
            config = confSnap.data() || {};

            const userRef = doc(db, "users", user.id.toString());
            const userSnap = await getDoc(userRef);

            if(userSnap.exists()) {
                userData = userSnap.data();
            } else {
                // --- NEW USER LOGIC ---
                const startParam = tg.initDataUnsafe.start_param; // Referrer UID
                userData = {
                    uid: user.id.toString(),
                    name: user.first_name,
                    balance: 50, // Join Bonus 50 TK
                    totalRefer: 0,
                    completedSocial: []
                };

                await setDoc(userRef, userData);

                // --- ADD BONUS TO REFERRER ---
                if (startParam && startParam !== userData.uid) {
                    const referrerRef = doc(db, "users", startParam);
                    const referrerSnap = await getDoc(referrerRef);
                    if (referrerSnap.exists()) {
                        await updateDoc(referrerRef, {
                            balance: increment(100), // Refer Bonus 100 TK
                            totalRefer: increment(1)
                        });
                    }
                }
                alert("স্বাগতম! আপনি ৫০ টাকা জয়েনিং বোনাস পেয়েছেন।");
            }

            renderTasks();
            renderSocial();
            updateUI();
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-container').style.opacity = '1';
            lucide.createIcons();
        }

        function updateUI() {
            document.getElementById('tk-balance').innerText = userData.balance.toFixed(2);
            document.getElementById('prof-name').innerText = userData.name;
            document.getElementById('prof-id').innerText = "ID: " + userData.uid;
            document.getElementById('prof-initial').innerText = userData.name[0];
            document.getElementById('total-ref').innerText = userData.totalRefer || 0;
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            for(let i=1; i<=3; i++) {
                list.innerHTML += `
                <div class="card-bg p-4 rounded-xl flex justify-between items-center">
                    <div class="flex items-center gap-3"><span class="text-2xl">🌐</span><div><p class="text-sm font-bold">Task 0${i}</p><p class="text-[10px] text-accent">৳ ৫০.০০</p></div></div>
                    <button onclick="doTask(${i}, '${config['linkWeb'+i]}')" class="btn-accent px-4 py-2 rounded-lg text-xs">শুরু করুন</button>
                </div>`;
            }
        }

        function renderSocial() {
            const list = document.getElementById('social-list');
            const items = [
                { id: 'tg', name: 'Telegram Channel', icon: 'send', link: config.linkTelegram },
                { id: 'fb', name: 'Facebook Page', icon: 'facebook', link: config.linkFacebook },
                { id: 'admin', name: 'Contact Admin', icon: 'message-circle', link: 'https://t.me/' + config.linkAdmin }
            ];
            list.innerHTML = '';
            items.forEach(item => {
                const isDone = userData.completedSocial?.includes(item.id);
                list.innerHTML += `
                <div class="card-bg p-4 rounded-xl flex justify-between items-center">
                    <div class="flex items-center gap-3"><i data-lucide="${item.icon}" class="w-5 text-gray-400"></i><p class="text-sm font-semibold">${item.name}</p></div>
                    <button onclick="doSocial('${item.id}', '${item.link}')" class="${isDone?'bg-gray-700 text-gray-400':'btn-accent'} px-4 py-2 rounded-lg text-xs">${isDone?'সম্পন্ন':'যোগ দিন'}</button>
                </div>`;
            });
            lucide.createIcons();
        }

        window.doTask = function(id, url) {
            if(!url) return alert("অ্যাডমিন এখনও লিঙ্ক সেট করেনি।");
            window.open(url, "_blank");
            setTimeout(async () => {
                await updateDoc(doc(db, "users", userData.uid), { balance: increment(50) });
                userData.balance += 50; updateUI(); alert("৳ ৫০ বোনাস যোগ হয়েছে!");
            }, 30000);
        }

        window.doSocial = async function(id, url) {
            if(userData.completedSocial?.includes(id)) return;
            window.open(url, "_blank");
            const newSocial = [...(userData.completedSocial || []), id];
            await updateDoc(doc(db, "users", userData.uid), { balance: increment(50), completedSocial: newSocial });
            userData.balance += 50; userData.completedSocial = newSocial;
            updateUI(); renderSocial(); alert("৳ ৫০ বোনাস যোগ হয়েছে!");
        }

        window.navigateTo = (id) => {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('withdraw-btn').onclick = async () => {
            const amt = parseFloat(document.getElementById('withdraw-amount').value);
            const num = document.getElementById('payment-number').value;
            const refers = userData.totalRefer || 0;

            if(refers < 5) return alert("উইথড্র করতে অন্তত ৫টি রেফার লাগবে! আপনার রেফার: " + refers);
            if(!amt || amt < 500) return alert("মিনিমাম ৫০০ টাকা উইথড্র করুন।");
            if(amt > userData.balance) return alert("আপনার যথেষ্ট ব্যালেন্স নেই।");
            if(!num) return alert("পেমেন্ট নম্বর দিন।");

            await updateDoc(doc(db, "users", userData.uid), { balance: increment(-amt) });
            await addDoc(collection(db, "withdrawals"), { uid: userData.uid, name: userData.name, amount: amt, method: document.getElementById('withdraw-method').value, number: num, status: 'pending', time: serverTimestamp() });
            userData.balance -= amt; updateUI(); alert("উইথড্র রিকোয়েস্ট পাঠানো হয়েছে!");
        };

        document.getElementById('share-btn').onclick = () => {
            const link = `https://t.me/bdfreeincometkBot?start=${userData.uid}`;
            navigator.clipboard.writeText(link); alert("লিঙ্ক কপি হয়েছে! বন্ধুদের পাঠিয়ে ইনকাম করুন।");
        };

        init();
    </script>
</body>
</html>
