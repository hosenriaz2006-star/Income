<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Income BD</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #ffffff; }
        .card-bg { background-color: #1e1e1e; border: 1px solid rgba(255,255,255,0.05); }
        .text-accent { color: #10b981; }
        .btn-accent { background-color: #10b981; color: #121212; font-weight: bold; }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="max-w-md mx-auto">

    <div id="loader" class="fixed inset-0 bg-[#121212] flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-accent mb-4"></div>
        <p class="text-accent font-bold">কানেক্ট হচ্ছে...</p>
    </div>

    <div id="app-container" class="min-h-screen flex flex-col opacity-0 transition-opacity duration-500">
        <header class="p-4 flex justify-between items-center sticky top-0 bg-[#121212]/80 backdrop-blur-md z-10">
            <h1 class="text-xl font-bold text-accent">TK Income BD</h1>
            <i data-lucide="user" onclick="navigateTo('profile-page')" class="cursor-pointer"></i>
        </header>

        <main class="flex-grow p-4 pb-24">
            <div id="home-page" class="sub-page active space-y-6">
                <div class="card-bg p-6 rounded-2xl flex justify-between items-center shadow-xl">
                    <div>
                        <p class="text-xs text-gray-400 uppercase">ব্যালেন্স</p>
                        <p class="text-3xl font-black text-accent">৳ <span id="tk-balance">0.00</span></p>
                    </div>
                    <button onclick="navigateTo('wallet-page')" class="bg-white text-black px-4 py-2 rounded-xl font-bold text-sm">উইথড্র</button>
                </div>

                <div class="space-y-4">
                    <h2 class="font-bold flex items-center gap-2"><i data-lucide="zap" class="text-yellow-400 w-5"></i> ডেইলি টাস্ক (৳ ৫০)</h2>
                    <div id="task-list" class="space-y-3"></div>
                </div>
            </div>

            <div id="profile-page" class="sub-page space-y-6">
                <div class="text-center py-4">
                    <div class="w-20 h-20 bg-accent rounded-full mx-auto flex items-center justify-center text-black text-3xl font-bold mb-2" id="prof-initial">U</div>
                    <h2 id="prof-name" class="text-xl font-bold">---</h2>
                    <p id="prof-id" class="text-gray-500 text-xs mt-1">ID: ---</p>
                </div>
                <div class="card-bg p-4 rounded-xl flex justify-between text-sm shadow-md">
                    <span>মোট রেফার:</span><span id="total-ref" class="text-accent font-bold">0</span>
                </div>
            </div>

            <div id="wallet-page" class="sub-page space-y-4">
                <h2 class="text-xl font-bold text-center">উইথড্র রিকোয়েস্ট</h2>
                <div class="card-bg p-5 rounded-2xl space-y-4 shadow-xl">
                    <p class="text-[11px] text-red-400 text-center font-bold">শর্ত: ৫টি রেফার এবং ৫০০ টাকা থাকতে হবে।</p>
                    <input id="withdraw-amount" type="number" placeholder="টাকার পরিমাণ (৫০০+)" class="w-full p-3 rounded-xl bg-black/40 border border-gray-700 outline-none">
                    <select id="withdraw-method" class="w-full p-3 rounded-xl bg-black/40 border border-gray-700 outline-none">
                        <option value="Bkash">বিকাশ</option>
                        <option value="Nagad">নগদ</option>
                    </select>
                    <input id="payment-number" type="number" placeholder="নম্বর দিন" class="w-full p-3 rounded-xl bg-black/40 border border-gray-700 outline-none">
                    <button id="withdraw-btn" class="w-full p-3 rounded-xl btn-accent">রিকোয়েস্ট পাঠান</button>
                </div>
            </div>

            <div id="refer-page" class="sub-page text-center space-y-6">
                <div class="card-bg p-8 rounded-[2rem] shadow-2xl">
                    <p class="text-gray-400 text-sm">প্রতি রেফারে বোনাস</p>
                    <h2 class="text-4xl font-black text-accent mt-2">৳ ১০০.০০</h2>
                    <p class="text-xs text-gray-500 mt-4">লিঙ্ক শেয়ার করুন এবং আনলিমিটেড আয় করুন।</p>
                    <button id="share-btn" class="w-full btn-accent py-4 rounded-2xl mt-8 flex items-center justify-center gap-2">
                        <i data-lucide="copy"></i> কপি রেফারেল লিঙ্ক
                    </button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 grid grid-cols-4 py-3 bg-[#121212] border-t border-white/5 z-20">
            <button onclick="navigateTo('home-page')"><i data-lucide="home" class="mx-auto w-6 h-6"></i></button>
            <button onclick="navigateTo('wallet-page')"><i data-lucide="wallet" class="mx-auto w-6 h-6"></i></button>
            <button onclick="navigateTo('refer-page')"><i data-lucide="users" class="mx-auto w-6 h-6"></i></button>
            <button onclick="navigateTo('profile-page')"><i data-lucide="user" class="mx-auto w-6 h-6"></i></button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, serverTimestamp, increment, runTransaction } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpH_zn1KQPcIsPojC02UzXLdc017e-Unw",
            authDomain: "bdincomezone-767b4.firebaseapp.com",
            projectId: "bdincomezone-767b4",
            storageBucket: "bdincomezone-767b4.firebasestorage.app",
            messagingSenderId: "1026541741286",
            appId: "1:1026541741286:web:735f4f134ab159b5d28727"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        let userData = null;
        let config = {};

        async function init() {
            tg.expand();
            tg.ready();
            const user = tg.initDataUnsafe?.user;
            if(!user) return;

            const uid = user.id.toString();
            const userRef = doc(db, "users", uid);

            // গ্লোবাল কনফিগ লোড
            const confSnap = await getDoc(doc(db, "config", "main"));
            config = confSnap.data() || {};

            const userSnap = await getDoc(userRef);

            if(userSnap.exists()) {
                userData = userSnap.data();
            } else {
                // --- FIXED REFERRAL LOGIC FOR DIRECT MINI APP ---
                const urlParams = new URLSearchParams(window.location.search);
                // এটি startapp প্যারামিটার থেকে আইডি খুঁজে বের করবে
                const startParam = tg.initDataUnsafe.start_param || urlParams.get('tgWebAppStartParam'); 
                
                userData = {
                    uid: uid,
                    name: user.first_name || "User",
                    balance: 50, // জয়েন বোনাস ৫০
                    totalRefer: 0,
                    completedSocial: []
                };

                try {
                    await runTransaction(db, async (transaction) => {
                        if (startParam && startParam !== uid) {
                            const referrerRef = doc(db, "users", startParam);
                            const referrerSnap = await transaction.get(referrerRef);
                            if (referrerSnap.exists()) {
                                transaction.update(referrerRef, {
                                    balance: increment(100), // রেফারার পাবে ১০০
                                    totalRefer: increment(1)
                                });
                            }
                        }
                        transaction.set(userRef, userData);
                    });
                    alert("স্বাগতম! আপনি ৫০ টাকা বোনাস পেয়েছেন।");
                } catch (e) {
                    await setDoc(userRef, userData);
                }
            }

            renderTasks();
            updateUI();
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-container').style.opacity = '1';
            lucide.createIcons();
        }

        function updateUI() {
            document.getElementById('tk-balance').innerText = userData.balance.toFixed(2);
            document.getElementById('prof-name').innerText = userData.name;
            document.getElementById('prof-id').innerText = "ID: " + userData.uid;
            document.getElementById('prof-initial').innerText = userData.name[0];
            document.getElementById('total-ref').innerText = userData.totalRefer || 0;
        }

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            for(let i=1; i<=3; i++) {
                if(config['linkWeb'+i]) {
                    list.innerHTML += `
                    <div class="card-bg p-4 rounded-xl flex justify-between items-center">
                        <div class="flex items-center gap-3">🌐<div><p class="text-sm font-bold">টাস্ক 0${i}</p><p class="text-[10px] text-accent">৳ ৫০.০০</p></div></div>
                        <button onclick="doTask(${i}, '${config['linkWeb'+i]}')" class="btn-accent px-4 py-2 rounded-lg text-xs">শুরু করুন</button>
                    </div>`;
                }
            }
        }

        window.doTask = function(id, url) {
            window.open(url, "_blank");
            setTimeout(async () => {
                await updateDoc(doc(db, "users", userData.uid), { balance: increment(50) });
                userData.balance += 50; updateUI(); alert("৳ ৫০ বোনাস যোগ হয়েছে!");
            }, 30000);
        }

        window.navigateTo = (id) => {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        document.getElementById('withdraw-btn').onclick = async () => {
            const amt = parseFloat(document.getElementById('withdraw-amount').value);
            const num = document.getElementById('payment-number').value;
            const refers = userData.totalRefer || 0;
            if(refers < 5) return alert("উইথড্র করতে কমপক্ষে ৫টি রেফার লাগবে!");
            if(!amt || amt < 500) return alert("মিনিমাম ৫০০ টাকা উইথড্র করুন।");
            if(amt > userData.balance) return alert("আপনার ব্যালেন্স পর্যাপ্ত নয়।");

            await updateDoc(doc(db, "users", userData.uid), { balance: increment(-amt) });
            await addDoc(collection(db, "withdrawals"), { uid: userData.uid, name: userData.name, amount: amt, method: document.getElementById('withdraw-method').value, number: num, status: 'pending', time: serverTimestamp() });
            userData.balance -= amt; updateUI(); alert("রিকোয়েস্ট পাঠানো হয়েছে!");
        };

        document.getElementById('share-btn').onclick = () => {
            // --- BOT USERNAME SET ---
            const botUser = "bdfreeincometkBot"; 
            const link = `https://t.me/${botUser}/app?startapp=${userData.uid}`;
            navigator.clipboard.writeText(link); 
            alert("রেফারেল লিঙ্ক কপি হয়েছে! সরাসরি শেয়ার করুন।");
        };

        init();
    </script>
</body>
</html>
