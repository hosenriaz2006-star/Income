<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taka Income BD - Telegram</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='8690632' data-sdk='show_8690632'></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #ffffff; overflow-x: hidden; }
        .card-bg { background-color: #1e1e1e; }
        .text-accent { color: #10b981; }
        .btn-accent { background-color: #10b981; color: #121212; font-weight: bold; }
        .main-page { display: none; }
        .main-page.active { display: flex; flex-direction: column; min-height: 100vh; }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="max-w-md mx-auto">

    <div id="loader" class="fixed inset-0 bg-[#121212] flex flex-col items-center justify-center z-50">
        <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-accent mb-4"></div>
        <p class="text-accent font-medium">Verifying Telegram Account...</p>
    </div>

    <div id="app-container" class="main-page">
        <header class="flex items-center justify-between p-4 sticky top-0 bg-[#121212] z-10">
            <h1 class="text-xl font-bold text-accent">Taka Income BD</h1>
            <div class="flex items-center space-x-4">
                <i data-lucide="bell" class="w-6 h-6 cursor-pointer" onclick="navigateTo('notifications-page')"></i>
                <i data-lucide="user" class="w-6 h-6 cursor-pointer" onclick="navigateTo('profile-page')"></i>
            </div>
        </header>

        <main class="flex-grow pb-20">
            <div id="home-page" class="p-4 space-y-6 sub-page active">
                <div class="card-bg p-6 rounded-2xl flex items-center justify-between shadow-lg">
                    <div>
                        <p class="text-gray-400 text-sm">Welcome, <span id="user-display-name">...</span></p>
                        <p class="text-3xl font-bold text-accent"><span id="coin-balance">0</span> <span class="text-sm text-white">Coins</span></p>
                    </div>
                    <button onclick="navigateTo('wallet-page')" class="bg-white text-black font-bold px-4 py-2 rounded-xl text-sm">Withdraw</button>
                </div>
                
                <section class="space-y-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2"><i data-lucide="zap" class="text-yellow-500"></i> Daily Tasks</h2>
                    <div class="grid grid-cols-1 gap-3">
                        <div class="card-bg p-4 rounded-xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="bg-green-500/10 p-2 rounded-lg text-green-500"><i data-lucide="globe"></i></div>
                                <div><h3 class="font-medium">Visit Website</h3><p class="text-xs text-gray-500">+50 Coins</p></div>
                            </div>
                            <button onclick="startWebTask(1)" class="btn-accent px-5 py-2 rounded-lg text-sm">Start</button>
                        </div>
                        <div class="card-bg p-4 rounded-xl flex items-center justify-between border border-orange-500/30">
                            <div class="flex items-center gap-3">
                                <div class="bg-orange-500/10 p-2 rounded-lg text-orange-500"><i data-lucide="play-circle"></i></div>
                                <div><h3 class="font-medium">Watch Video Ad</h3><p class="text-xs text-gray-500">+50 Coins</p></div>
                            </div>
                            <button onclick="claimReward('interstitial')" class="btn-accent px-5 py-2 rounded-lg text-sm">Watch</button>
                        </div>
                    </div>
                </section>
            </div>

            <div id="refer-page" class="p-4 space-y-6 sub-page">
                <h2 class="text-xl font-bold text-center">Refer & Earn</h2>
                <div class="card-bg p-8 rounded-2xl text-center border-2 border-dashed border-accent/30">
                    <p class="text-gray-400 mb-4 text-sm">Invite friends and earn 200 coins per referral!</p>
                    <div class="bg-black/40 p-4 rounded-xl mb-6">
                        <span id="referral-code" class="text-2xl font-bold tracking-widest text-accent">LOADING...</span>
                    </div>
                    <button id="share-btn" class="w-full btn-accent py-4 rounded-xl flex items-center justify-center gap-2">
                        <i data-lucide="share-2" class="w-5 h-5"></i> Invite Friends
                    </button>
                </div>
            </div>

            <div id="wallet-page" class="p-4 sub-page text-center"><p>Wallet Content (Original)</p></div>
            <div id="profile-page" class="p-4 sub-page text-center">
                 <h2 id="prof-name" class="text-xl font-bold"></h2>
                 <p id="prof-id" class="text-gray-500"></p>
                 <button onclick="logout()" class="mt-4 text-red-500">Exit App</button>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 grid grid-cols-4 items-center text-center py-3 card-bg border-t border-white/5">
            <a href="#" onclick="navigateTo('home-page')" class="nav-link text-accent"><i data-lucide="home" class="mx-auto mb-1"></i><span class="text-[10px]">Home</span></a>
            <a href="#" onclick="navigateTo('wallet-page')" class="nav-link"><i data-lucide="wallet" class="mx-auto mb-1"></i><span class="text-[10px]">Wallet</span></a>
            <a href="#" onclick="navigateTo('refer-page')" class="nav-link"><i data-lucide="users" class="mx-auto mb-1"></i><span class="text-[10px]">Refer</span></a>
            <a href="#" onclick="navigateTo('profile-page')" class="nav-link"><i data-lucide="user" class="mx-auto mb-1"></i><span class="text-[10px]">Profile</span></a>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpH_zn1KQPcIsPojC02UzXLdc017e-Unw",
            authDomain: "bdincomezone-767b4.firebaseapp.com",
            databaseURL: "https://bdincomezone-767b4-default-rtdb.firebaseio.com",
            projectId: "bdincomezone-767b4",
            storageBucket: "bdincomezone-767b4.firebasestorage.app",
            messagingSenderId: "1026541741286",
            appId: "1:1026541741286:web:735f4f134ab159b5d28727"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;

        let userData = null;
        const BOT_USERNAME = "YourBotUsername"; // আপনার টেলিগ্রাম বটের ইউজারনেম এখানে দিন

        async function initApp() {
            tg.expand();
            tg.ready();

            const user = tg.initDataUnsafe?.user;

            if (!user) {
                document.body.innerHTML = "<div class='p-10 text-center text-red-500'>Please open this app from Telegram!</div>";
                return;
            }

            const userRef = doc(db, "users", user.id.toString());
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                userData = userSnap.data();
            } else {
                // New User Registration
                userData = {
                    uid: user.id.toString(),
                    name: user.first_name + (user.last_name ? " " + user.last_name : ""),
                    username: user.username || "anonymous",
                    balance: 50,
                    referralCode: user.id.toString(),
                    createdAt: serverTimestamp(),
                    dailyAdCount: 0
                };
                await setDoc(userRef, userData);
                
                // Check if user came via a referral link
                const startParam = tg.initDataUnsafe.start_param;
                if(startParam && startParam !== user.id.toString()) {
                    processReferral(startParam);
                }
            }

            updateUI();
            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-container').classList.add('active');
            lucide.createIcons();
        }

        function updateUI() {
            document.getElementById('user-display-name').textContent = userData.name;
            document.getElementById('coin-balance').textContent = userData.balance;
            document.getElementById('referral-code').textContent = userData.uid;
            document.getElementById('prof-name').textContent = userData.name;
            document.getElementById('prof-id').textContent = "ID: " + userData.uid;
        }

        window.navigateTo = function(pageId) {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        document.getElementById('share-btn').onclick = function() {
            const inviteLink = `https://t.me/${BOT_USERNAME}?start=${userData.uid}`;
            const text = `🔥 সেরা ইনকাম অ্যাপ! জয়েন করলেই ৫০ কয়েন ফ্রি। লিঙ্ক: ${inviteLink}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${encodeURIComponent(text)}`);
        }

        async function processReferral(referrerId) {
            const refDoc = doc(db, "users", referrerId);
            const refSnap = await getDoc(refDoc);
            if(refSnap.exists()) {
                const refData = refSnap.data();
                await updateDoc(refDoc, { balance: (refData.balance || 0) + 200 });
                // Note: Logic for new user bonus is already in the initApp
            }
        }

        // Initialize
        initApp();
    </script>
</body>
</html>
