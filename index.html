<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK Income BD</title>
    
    <script src="https://pl29060362.profitablecpmratenetwork.com/6f/77/34/6f77345e70ab503e89dfa39ef72c9cd1.js"></script>
    <script src="https://pl29060371.profitablecpmratenetwork.com/b4/56/77/b45677b6da858a405fe18219565ec10d.js"></script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0a0a0a; color: #ffffff; }
        .card-bg { background: linear-gradient(145deg, #161616, #1f1f1f); border: 1px solid rgba(255,255,255,0.05); }
        .btn-emerald { background: linear-gradient(to right, #10b981, #059669); color: white; font-weight: bold; }
        .sub-page { display: none; }
        .sub-page.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .locked-btn { background: #262626 !important; color: #6b7280 !important; pointer-events: none; }
        .nav-active { color: #10b981 !important; transform: translateY(-5px); }
    </style>
</head>
<body class="max-w-md mx-auto select-none">

    <div id="loader" class="fixed inset-0 bg-[#0a0a0a] flex flex-col items-center justify-center z-[100]">
        <div class="w-10 h-10 border-4 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin"></div>
    </div>

    <div id="app-container" class="min-h-screen flex flex-col opacity-0 transition-opacity duration-500">
        <header class="p-4 flex justify-between items-center sticky top-0 bg-[#0a0a0a]/90 backdrop-blur-md z-50 border-b border-white/5">
            <h1 class="font-black text-xl text-emerald-500">TK Income</h1>
            <div class="bg-emerald-500/10 px-4 py-1.5 rounded-full border border-emerald-500/20 flex items-center gap-2">
                <i data-lucide="wallet" class="w-4 text-emerald-400"></i>
                <span id="header-balance" class="text-emerald-400 font-bold text-sm">৳ 0.00</span>
            </div>
        </header>

        <main class="flex-grow p-4 pb-28">
            <div id="home-page" class="sub-page active space-y-6">
                <div id="broadcast-box" class="hidden bg-blue-600/10 border border-blue-500/20 p-4 rounded-2xl flex items-start gap-3">
                    <i data-lucide="megaphone" class="w-5 text-blue-500 mt-1"></i>
                    <p id="broadcast-text" class="text-sm text-blue-100 font-medium"></p>
                </div>

                <div class="card-bg p-10 rounded-[2.5rem] text-center shadow-2xl relative overflow-hidden">
                    <p class="text-xs text-gray-500 uppercase tracking-widest font-bold">Current Balance</p>
                    <h2 class="text-5xl font-black text-white mt-2 tracking-tighter">৳ <span id="tk-balance">0.00</span></h2>
                </div>

                <div id="official-box" class="card-bg p-6 rounded-3xl border border-emerald-500/20 flex justify-between items-center">
                    <div>
                        <h4 class="font-bold text-sm">Official Group Join</h4>
                        <p class="text-[10px] text-emerald-500">Reward: ৳ ৫০.০০</p>
                    </div>
                    <button onclick="joinOfficial()" class="btn-emerald px-4 py-2 rounded-xl text-xs">Join Now</button>
                </div>

                <div class="space-y-4">
                    <h3 class="font-bold flex items-center gap-2 text-gray-300"><i data-lucide="zap" class="w-5 text-yellow-500"></i> ডেইলি টাস্ক (২ মিনিট বিরতি)</h3>
                    <div id="task-list" class="space-y-3"></div>
                </div>
            </div>

            <div id="wallet-page" class="sub-page space-y-5">
                <div class="card-bg p-8 rounded-[2.5rem] space-y-5 text-center">
                    <h2 class="text-2xl font-bold">উইথড্র</h2>
                    <input id="withdraw-amount" type="number" placeholder="৳ পরিমাণ" class="w-full p-4 rounded-2xl bg-black/50 border border-white/5 outline-none focus:border-emerald-500">
                    <input id="payment-number" type="number" placeholder="বিকাশ/নগদ নম্বর" class="w-full p-4 rounded-2xl bg-black/50 border border-white/5 outline-none focus:border-emerald-500">
                    <button id="withdraw-btn" class="w-full py-4 rounded-2xl btn-emerald">রিকোয়েস্ট পাঠান</button>
                </div>
            </div>

            <div id="profile-page" class="sub-page space-y-6">
                <div class="card-bg p-8 rounded-[2.5rem] text-center">
                    <div class="w-20 h-20 bg-emerald-500/10 rounded-full mx-auto flex items-center justify-center mb-4"><i data-lucide="user" class="w-10 text-emerald-500"></i></div>
                    <h2 id="user-name" class="text-xl font-bold">User Name</h2>
                    <p class="text-gray-500 text-xs mt-1">ID: <span id="user-id">0000</span></p>
                    <div class="grid grid-cols-2 gap-4 mt-8">
                        <div class="bg-black/40 p-4 rounded-2xl border border-white/5">
                            <p class="text-[10px] text-gray-500 uppercase">Refer</p>
                            <p id="total-ref" class="text-lg font-bold">0</p>
                        </div>
                        <div onclick="contactAdmin()" class="bg-emerald-500/10 p-4 rounded-2xl border border-emerald-500/20 cursor-pointer">
                            <p class="text-[10px] text-emerald-500 uppercase">Support</p>
                            <p class="text-sm font-bold">Contact Admin</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 bg-[#0a0a0a] border-t border-white/5 px-10 py-5 flex justify-between items-center z-[90]">
            <button onclick="navigateTo('home-page', this)" class="nav-item nav-active transition-all"><i data-lucide="home"></i></button>
            <button onclick="navigateTo('wallet-page', this)" class="nav-item text-gray-600 transition-all"><i data-lucide="wallet"></i></button>
            <button onclick="navigateTo('profile-page', this)" class="nav-item text-gray-600 transition-all"><i data-lucide="user"></i></button>
        </nav>
    </div>

    <div id="timer-overlay" class="fixed inset-0 bg-black/98 z-[200] hidden flex flex-col items-center justify-center p-8 text-center">
        <div class="w-16 h-16 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-6"></div>
        <h3 id="timer-text" class="text-4xl font-black">30</h3>
        <p class="text-gray-500 mt-2">অপেক্ষা করুন...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, setDoc, increment, addDoc, collection, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDpH_zn1KQPcIsPojC02UzXLdc017e-Unw",
            authDomain: "bdincomezone-767b4.firebaseapp.com",
            projectId: "bdincomezone-767b4",
            storageBucket: "bdincomezone-767b4.firebasestorage.app",
            messagingSenderId: "1026541741286",
            appId: "1:1026541741286:web:735f4f134ab159b5d28727"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tg = window.Telegram.WebApp;
        let userData = null;
        let config = {};

        async function init() {
            const user = tg.initDataUnsafe?.user;
            if(!user) return;
            const uid = user.id.toString();
            
            // Realtime Config & Broadcast
            onSnapshot(doc(db, "config", "main"), (snap) => {
                config = snap.data() || {};
                const bBox = document.getElementById('broadcast-box');
                if(config.announcement) {
                    bBox.classList.remove('hidden');
                    document.getElementById('broadcast-text').innerText = config.announcement;
                } else {
                    bBox.classList.add('hidden');
                }
                renderTasks();
            });

            // Realtime User Data
            onSnapshot(doc(db, "users", uid), async (snap) => {
                if(snap.exists()) {
                    userData = snap.data();
                } else {
                    userData = { uid, name: user.first_name, balance: 0, lastTaskTime: 0, totalRefer: 0, officialJoined: false };
                    await setDoc(doc(db, "users", uid), userData);
                }
                updateUI();
                renderTasks();
                document.getElementById('loader').style.display = 'none';
                document.getElementById('app-container').style.opacity = '1';
            });
            lucide.createIcons();
        }

        function updateUI() {
            document.getElementById('tk-balance').innerText = userData.balance.toFixed(2);
            document.getElementById('header-balance').innerText = "৳ " + userData.balance.toFixed(2);
            document.getElementById('user-name').innerText = userData.name;
            document.getElementById('user-id').innerText = userData.uid;
            document.getElementById('total-ref').innerText = userData.totalRefer || 0;
            document.getElementById('official-box').style.display = userData.officialJoined ? 'none' : 'flex';
        }

        window.joinOfficial = async () => {
            window.open(config.linkTelegram, "_blank");
            setTimeout(async () => {
                await updateDoc(doc(db, "users", userData.uid), { balance: increment(50), officialJoined: true });
                alert("জয়েন বোনাস ৫০ টাকা যোগ হয়েছে!");
            }, 5000);
        };

        window.contactAdmin = () => window.open("https://t.me/" + config.linkAdmin, "_blank");

        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            const now = Date.now();
            const cooldown = 2 * 60 * 1000;
            const timeLeft = Math.max(0, (userData.lastTaskTime + cooldown) - now);

            for(let i=1; i<=3; i++) {
                const isLocked = timeLeft > 0;
                list.innerHTML += `
                <div class="card-bg p-5 rounded-2xl flex justify-between items-center ${isLocked ? 'opacity-40' : ''}">
                    <div class="flex items-center gap-4">🌐 <div><p class="font-bold text-sm">টাস্ক 0${i}</p><p class="text-xs text-emerald-500">৳ ৫০.০০</p></div></div>
                    <button onclick="startTask(${i}, '${config['linkWeb'+i]}')" class="px-6 py-2.5 rounded-xl text-xs font-bold ${isLocked ? 'locked-btn' : 'btn-emerald'}">
                        ${isLocked ? Math.ceil(timeLeft/1000) + 's' : 'শুরু'}
                    </button>
                </div>`;
            }
        }

        window.startTask = (id, url) => {
            window.open(url, "_blank");
            const overlay = document.getElementById('timer-overlay');
            overlay.classList.remove('hidden');
            let count = 30;
            const itv = setInterval(async () => {
                count--; document.getElementById('timer-text').innerText = count;
                if(count <= 0) {
                    clearInterval(itv); overlay.classList.add('hidden');
                    await updateDoc(doc(db, "users", userData.uid), { balance: increment(50), lastTaskTime: Date.now() });
                }
            }, 1000);
        };

        window.navigateTo = (id, btn) => {
            document.querySelectorAll('.sub-page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('nav-active', 'text-emerald-500'));
            btn.classList.add('nav-active');
        };

        document.getElementById('withdraw-btn').onclick = async () => {
            const amt = parseFloat(document.getElementById('withdraw-amount').value);
            const num = document.getElementById('payment-number').value;
            if(amt < 500 || amt > userData.balance) return alert("সঠিক পরিমাণ দিন (মিনিমাম ৫০০)!");
            if(!num) return alert("নম্বর দিন!");
            await updateDoc(doc(db, "users", userData.uid), { balance: increment(-amt) });
            await addDoc(collection(db, "withdrawals"), { uid: userData.uid, name: userData.name, amount: amt, method: 'Bkash/Nagad', number: num, time: serverTimestamp() });
            alert("উইথড্র রিকোয়েস্ট পাঠানো হয়েছে!");
        };

        init();
    </script>
</body>
</html>
